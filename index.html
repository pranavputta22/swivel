  function setSeen(v) {
    seen = v;
    try { if (v) window.localStorage.setItem(SEEN_KEY, v); else window.localStorage.removeItem(SEEN_KEY); } catch (e) { /* storage can be missing */ }
    mirror();
  }
  function blankSlate() { return !Object.keys(save.stars).length && !Object.keys(save.daily.results).length && !Object.keys(save.endless).length; }
  function modesOpen() { return seen !== 'new' || totalSolved() >= 3; }
  // Inside Claude the page runs in a frame and the host offers the player's account. There an empty
  // browser store is no proof of a first visit: phones hand one back now and then, and the account
  // still knows the player. A page opened by itself has no account to ask.
  function accountLikely() {
    if (TRIAL || cloud.off) return false;
    if (window.claude && typeof window.claude.use === 'function') return true;
    try { return window.self !== window.top; } catch (e) { return true; }
  }
  var ACCOUNT_WAIT = 2500;
  var undecided = false; // waiting for the account before calling anyone new
  var guided = null;     // the first level the opening put up by itself
  function welcome(sure) {
    if (seen || !blankSlate()) { if (!seen) setSeen('1'); return false; }
    if (!sure && accountLikely() && !cloud.settled) {
      // the menu's entries stay out of sight meanwhile: the title stands alone, as a splash would
      if (!undecided) { undecided = true; screens.home.classList.add('waiting'); setTimeout(settle, ACCOUNT_WAIT); }
      return false;
    }
    setSeen('new');
    startCampaign(0, 0);
    guided = G;
    return true;
  }
  // the account has answered, or the wait is over: now it is known who is new
  function settle() {
    if (!undecided) return;
    undecided = false;
    screens.home.classList.remove('waiting');
    if (!seen) {
      if (!blankSlate()) setSeen('1');
      // nothing in the account either: a first visit. The first level goes up unless the player
      // is already somewhere (a board the account put back, a sheet they opened meanwhile).
      else if (G || current !== 'home' || touchedYet || !welcome(true)) setSeen('new');
    }
    if (current === 'home') renderHome();
  }
  function boot(data) {
    var p = readPlace();
    if (p) kept = validRecord(p.kept);
    if (linked) { var l0 = linked; linked = null; if (arrive(l0)) return; }
    // nothing handed over by the host: use what this device wrote down, if it is recent
    if (!data || (!data.game && !data.screen)) {
      var age = p && p.t ? Date.now() - p.t : -1;
      data = age >= 0 && age < PLACE_FRESH ? p : {};
    }
    var g = validRecord(data.game);
    if (g && resume(g)) return;
    if (data.screen === 'levels') { show('levels'); return; }
    // the account can be quicker than the host's handover, and may have put a board back already
    if (G || current !== 'home') { if (!seen) setSeen(blankSlate() ? 'new' : '1'); return; }
    welcome();
  }
  // open the board a record describes, with its moves replayed; false if it cannot be opened
  function resume(g) {
    var before = kept;
    try {
      kept = g;
      var wi = g.mode === 'campaign' ? worldIndex(g.w) : -1, opened = false;
      if (wi >= 0 && WORLDS[wi].levels[g.li]) { startCampaign(wi, g.li); opened = true; }
      else if (g.mode === 'daily' && g.date === today()) { startDaily(); opened = true; }
      else if (g.mode === 'endless' && ENDLESS[g.tier] && g.seed) { startEndless(g.tier, g.seed); opened = true; }
      else if (g.mode === 'custom' && readBoard(g.start)) { startCustom(g.start); opened = true; }
      else if (g.mode === 'album' && startAlbum(g.pic, g.ptier, g.b)) opened = true;
      if (opened) {
        if (!sameBoard(g, G)) kept = before; // the board has changed since: it opens fresh
        return true;
      }
    } catch (e) { /* fall through to the menu */ }
    kept = before;
    return false;
  }
  var touchedYet = false;
  function markTouched() { touchedYet = true; }
  document.addEventListener('pointerdown', markTouched, true);
  document.addEventListener('keydown', markTouched, true);
  setScene(homeScene());
  renderHome();
  startAmbient();
  // Someone who may be new is not shown a menu they are about to be taken past (or, inside Claude,
  // one that is about to change once the account answers): the title stands alone until it is known.
  if (!seen && blankSlate()) screens.home.classList.add('waiting');
  // a link the page was opened with, or one the app was opened with
  linked = takeHash() || (shell.given && typeof shell.given.open === 'string' ? readLink(shell.given.open) : null);
  window.addEventListener('hashchange', function () { var l = takeHash(); if (l) { if (booted) arrive(l); else linked = l; } });
  // the app hands over a link it was opened with while the game is already running
  window.__swivelOpen = function (text) { var l = shell.on ? readLink(text) : null; if (!l) return false; if (booted) arrive(l); else linked = l; return true; };
  var booted = false;
  function bootOnce(data) { if (booted) return; booted = true; boot(data); if (!undecided) screens.home.classList.remove('waiting'); }
  var hot = window.claude && window.claude.hot, waiting = false;
  try { if (hot && hot.snapshot) hot.snapshot(snapshot); } catch (e) { /* ignore */ }
  try { if (hot && typeof hot.ready === 'function') { hot.ready(bootOnce); waiting = true; } } catch (e) { waiting = false; }
  // never wait on the host for long: the game must start by itself
  if (waiting) setTimeout(function () { bootOnce(hot.data || {}); }, 600);
  else bootOnce((hot && hot.data) || {});
  // the place is also written down when the page is sent to the background
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { notePlace(); flushPlace(); mirrorNow(); } musicSync(); });
  window.addEventListener('pagehide', function () { notePlace(); flushPlace(); mirrorNow(); });
  if (!TRIAL && !shell.on) initCloud(); // (the app has no Claude account to ask)
  // While the game is open, the player's iCloud can bring a change made on another phone of theirs.
  window.__swivelProgress = function (json) {
    if (!shell.on || !takeProgress(json)) return false;
    backfillAlbum();
    if (seen !== '1' && !blankSlate()) setSeen('1');
    if (current === 'home') renderHome();
    if (current === 'levels') renderLevels();
    if (current === 'album') renderAlbum();
    return true;
  };
  window.__swivelOtherAudio = function (playing) { mus.other = shell.on && playing === true; musicSync(); return mus.other; };
  if (shell.on) { mirror(); shell.post('ready', { version: VERSION, build: BUILD }); if (remind === 'on') askReminder(true); }

  // a small handle for automated tests; harmless in normal play
  window.__swivel = {
    core: C, worlds: WORLDS, state: function () { return G; }, save: function () { return save; },
    startCampaign: startCampaign, startDaily: startDaily, startEndless: startEndless,
    tap: tapPiece, undo: undo, hint: hint, restart: restart, show: show,
    startCustom: startCustom, replay: replay, endReplay: endReplay, levelCode: levelCode, readCode: readCode, readBoard: readBoard,
    fillShape: fillShape, drawing: function () { return draw; }, loadRows: loadRows, makeLevel: makeLevel,
    dailyBoard: dailyBoard, dailyPicture: dailyPicture, tunedBoard: tunedBoard, endless: ENDLESS, daily: DAILY, cloud: cloud, placeSync: placeSync,
    busy: function () { return !!(G && G.casc); }, finish: finishCascade, upgrade: upgrade, mergeSave: mergeSave,
    seen: function () { return seen; }, undecided: function () { return undecided; },
    startAlbum: startAlbum, openRun: openRun, pictures: PICS.shapes, lastFinale: function () { return lastFinale; },
    music: function () { return { bed: mus.bed ? mus.bed.id : '', starts: mus.starts, other: mus.other, wanted: musicWanted(), ctx: actx ? actx.state : 'none', level: MUSIC_LEVEL, log: mus.log.slice(-80) }; },
    beds: BEDS, inKey: inKey, winNotes: winNotes, renderMusic: renderMusic, audio: function () { return actx; }, mix: { parts: MIX, tone: WARM, pad: PADMIX },
    master: MASTER, softCeiling: softCeiling,
    progressCode: progressCode, readProgress: readProgress, joinSave: joinSave,
    readLink: readLink, linkFor: linkFor, arrive: arrive, canShare: canShare, today: today, hard: HARD, picCycle: PIC_CYCLE,
    gameState: gameState, reminderPlan: reminderPlan, reminder: function () { return remind; }, nameplate: nameplate,
    setSkin: setSkin, burstAt: burstAt, skin: function () { return skin; },
    // deal any board, for tests: it plays as an endless board on the easy tier
    custom: function (s) { kept = null; startGame({ mode: 'endless', tier: 0, seed: 12345, title: 'Test', num: '', start: s, tip: '' }); }
  };
})();

</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', function () {
  navigator.serviceWorker.register('sw.js').catch(function () { /* the game still runs online */ });
});
</script>
